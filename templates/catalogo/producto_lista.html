{% extends "base.html" %}
{% block title %}Productos{% endblock %}
{% block nav_productos %}active{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2 class="mb-0">Productos</h2>
  <div class="d-flex gap-2">
    <a href="{% url 'catalogo:producto_importar_csv' %}" class="btn btn-outline-secondary">
      <i class="bi bi-upload"></i> Importar CSV
    </a>
    <a href="{% url 'catalogo:producto_crear' %}" class="btn btn-primary">
      <i class="bi bi-plus-lg"></i> Nuevo producto
    </a>
  </div>
</div>

<div class="card shadow-sm border-0 mb-3">
  <div class="card-body py-2 px-3">
    <div class="row g-2 align-items-center">
      <div class="col-md-6">
        <input
          type="text"
          name="q"
          id="buscador"
          class="form-control"
          placeholder="Buscar por nombre o código..."
          hx-get="{% url 'catalogo:producto_buscar' %}"
          hx-trigger="keyup changed delay:300ms"
          hx-target="#tabla-productos"
          hx-include="#filtro-categoria"
        >
      </div>
      <div class="col-md-4">
        <select
          name="categoria"
          id="filtro-categoria"
          class="form-select"
          hx-get="{% url 'catalogo:producto_buscar' %}"
          hx-trigger="change"
          hx-target="#tabla-productos"
          hx-include="#buscador"
        >
          <option value="">Todas las categorías</option>
          {% for cat in categorias %}
          <option value="{{ cat.pk }}">{{ cat.nombre }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-2 text-end">
        <span class="text-muted small htmx-indicator">
          <span class="spinner-border spinner-border-sm"></span> Buscando…
        </span>
      </div>
    </div>
  </div>
</div>

<div class="card shadow-sm border-0">
  <table class="table table-hover mb-0">
    <thead class="table-light">
      <tr>
        <th>Código</th>
        <th>Nombre</th>
        <th>Categoría</th>
        <th>Tipo</th>
        <th class="text-end">Stock</th>
        <th class="text-end">Costo</th>
        <th class="text-end">Precio venta</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tabla-productos">
      {% include "catalogo/producto_tabla.html" %}
    </tbody>
  </table>
</div>
{% endblock %}
