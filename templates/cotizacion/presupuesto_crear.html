{% extends "base.html" %}
{% block title %}Nuevo presupuesto{% endblock %}
{% block nav_presupuestos %}active{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-5">
    <div class="d-flex align-items-center gap-2 mb-4">
      <a href="{% url 'cotizacion:lista' %}" class="btn btn-sm btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
      </a>
      <h2 class="mb-0">Nuevo presupuesto</h2>
    </div>
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          <div class="mb-4">
            <label class="form-label fw-semibold">Nombre del cliente</label>
            {{ form.cliente }}
            {% if form.cliente.errors %}
              <div class="text-danger small mt-1">{{ form.cliente.errors.0 }}</div>
            {% endif %}
          </div>
          <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-arrow-right"></i> Continuar
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
