{% extends "base.html" %}

{% block title %}Ingresar — Gestor Taller{% endblock %}

{% block auth_content %}
<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card shadow-sm" style="width: 360px;">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <i class="bi bi-tools fs-1 text-primary"></i>
        <h4 class="mt-2 mb-0">Gestor de Taller</h4>
        <small class="text-muted">Ingresá con tu usuario</small>
      </div>
      <form method="post">
        {% csrf_token %}
        {% if form.errors %}
          <div class="alert alert-danger py-2">Usuario o contraseña incorrectos.</div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-4">
          <label class="form-label">Contraseña</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Ingresar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
